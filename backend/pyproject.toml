[project]
name = "warsaw-open-data-backend"
version = "0.1.0"
description = "Data download, parsers and FastAPI endpoints for WarsawOpenData"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "osmium>=4.0",
    "numpy>=2.0",
    "scipy>=1.14",
    "python-dotenv>=1.0",
]
